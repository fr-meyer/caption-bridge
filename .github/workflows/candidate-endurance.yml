name: Candidate endurance (provider-free)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      sha:
        description: Exact commit to validate before release
        required: true
        type: string
  workflow_dispatch:
    inputs:
      sha:
        description: Exact full commit SHA for recovery validation
        required: true
        type: string
permissions:
  contents: read
# Do not auto-cancel a running acceptance record for a newer push.
jobs:
  candidate-100-cycles:
    name: candidate-100-cycles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Require an exact commit
        run: '[[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Bind execution to the triggering commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: false
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: uv python install 3.13
      - run: uv sync --frozen --python 3.13
      - name: Deterministic tool and ASR fault contracts
        run: >-
          uv run --python 3.13 python -m pytest -q
          tests/unit/test_candidate_endurance.py tests/unit/test_playback_timing_compare.py
          tests/unit/test_reconnect.py tests/unit/test_full_pipeline_scenario.py
      - name: Exactly 100 guarded application fault cycles
        run: uv run --python 3.13 python -m scripts.candidate_endurance --cycles 100 --output acceptance/endurance.json
      - name: Retain aggregate report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-endurance
          path: acceptance/*.json
          retention-days: 7
          if-no-files-found: warn
