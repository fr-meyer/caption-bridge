name: Candidate endurance (manual, provider-free)
on:
  workflow_dispatch:
permissions:
  contents: read
# Do not auto-cancel a running acceptance record for a newer push.
jobs:
  endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: false
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: uv python install 3.13
      - run: uv sync --frozen --python 3.13
      - name: Deterministic tool and ASR fault contracts
        run: >-
          uv run --python 3.13 python -m pytest -q
          tests/unit/test_candidate_endurance.py tests/unit/test_playback_timing_compare.py
          tests/unit/test_reconnect.py tests/unit/test_full_pipeline_scenario.py
      - name: Smoke guarded application cycles before the long run
        run: uv run --python 3.13 python -m scripts.candidate_endurance --minutes 0.05 --output acceptance/smoke.json
      - name: Continuous 120-minute application fault cycles
        run: uv run --python 3.13 python -m scripts.candidate_endurance --minutes 120 --output acceptance/endurance.json
      - name: Retain aggregate report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-endurance
          path: acceptance/endurance.json
          retention-days: 7
          if-no-files-found: warn
