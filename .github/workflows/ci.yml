name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: false

      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync locked dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Audit the locked runtime closure (Linux, Python 3.11)
        if: matrix.python-version == '3.11'
        timeout-minutes: 5
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/caption-runtime.txt"
          uvx --python 3.11 --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip --require-hashes -r "$RUNNER_TEMP/caption-runtime.txt" --format json --output "$RUNNER_TEMP/caption-runtime-audit.json"

      - name: Retain the runtime dependency audit
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-dependency-audit-linux-py311
          path: ${{ runner.temp }}/caption-runtime-audit.json
          retention-days: 7
          if-no-files-found: warn

      - name: Lint Python
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Benchmark translation quality
        run: >-
          uv run --python ${{ matrix.python-version }} python -m scripts.benchmark_translation_quality
          --max-false-positive-rate 0.05 --min-recall 1.0 --require-exact-reasons

      - name: Benchmark semantic segmentation
        run: >-
          uv run --python ${{ matrix.python-version }} python -m scripts.benchmark_segmentation
          --max-unexpected-standalone 0 --max-delayed-clear 0
          --max-policy-delay-ms 4500 --json

      - name: Translation resilience soak
        run: >-
          uv run --python ${{ matrix.python-version }} python -m scripts.resilience_soak
          --segments 1000 --json

      - name: Full pipeline scenario
        run: >-
          uv run --python ${{ matrix.python-version }} python -m scripts.full_pipeline_scenario
          --json

      - name: Test
        run: uv run --python ${{ matrix.python-version }} python -m pytest -q

      - name: Check browser JavaScript
        run: |
          node --check app/static/app.js
          node --check app/static/pcm-player.js
          node --check app/static/audio-devices.js

      - name: Test pitch-preserving PCM evaluation
        if: matrix.python-version == '3.11'
        timeout-minutes: 1
        run: >-
          node --max-old-space-size=128 --test --test-concurrency=1
          speed-evaluation/pitch/test_wsola.cjs
          speed-evaluation/pitch/test_transform_client.cjs
          speed-evaluation/pitch/test_transform_memory.cjs
          speed-evaluation/pitch/test_benchmark_pcm.cjs

      - name: Test offline v0.5 reliability and Windows software contracts
        if: matrix.python-version == '3.11'
        timeout-minutes: 2
        run: >-
          uv run --python 3.11 python -B evaluations/reliability_v050/run_offline.py
          --receipt-dir "$RUNNER_TEMP/caption-reliability-v050"

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: false

      - name: Install Python
        run: uv python install 3.13

      - name: Sync locked dependencies
        run: uv sync --frozen --python 3.13

      - name: Install Chromium
        run: uv run --python 3.13 python -m playwright install --with-deps chromium

      - name: Run browser end-to-end contracts
        run: uv run --python 3.13 python -m pytest -q browser_tests --browser chromium

      - name: Test synthetic browser audio routing
        run: node --test tests/audio-devices.test.cjs

  software-lifecycle:
    name: Software lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: false
      - name: Install macOS PortAudio (no capture)
        if: runner.os == 'macOS'
        run: brew list portaudio || brew install portaudio
      - run: uv python install 3.13
      - run: uv sync --frozen --python 3.13
      - name: Test software lifecycle and offline recovery
        run: >-
          uv run --python 3.13 python -m pytest -q
          tests/test_lifecycle.py tests/test_health.py
          tests/unit/test_reconnect.py tests/unit/test_full_pipeline_scenario.py
      - name: Run provider-free pipeline scenario
        run: uv run --python 3.13 python -m scripts.full_pipeline_scenario --json

      # Hosted runner only. No meeting Mac, capture API or provider invocation.
      - name: Build and qualify sandboxed helper (no audio)
        if: runner.os == 'macOS'
        timeout-minutes: 2
        shell: bash
        run: |
          uv run --no-sync --python 3.13 python - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import selectors
          import signal
          import subprocess
          import sys
          import time

          output = Path(os.environ["RUNNER_TEMP"]) / "caption-helper-noaudio-build"
          receipt_path = Path(os.environ["RUNNER_TEMP"]) / "caption-helper-noaudio-receipt.json"
          receipt = {"schema": 1, "qualification": "NO_AUDIO_ONLY", "capture_authorized": False,
                     "provider_calls": 0, "source_hashes": {}, "image_hashes": {},
                     "signing_identities": {}, "probe_outcome": "NOT_RUN",
                     "cleanup": "EPHEMERAL_RUNNER_ONLY"}
          diagnostic_path = Path(os.environ["RUNNER_TEMP"]) / "caption-helper-build-diagnostics.txt"
          stage = "source"
          started = time.monotonic()
          limit = 65536

          def bounded(args, timeout, *, build=False, check=True):
              data = bytearray()
              child = subprocess.Popen(args, stdout=subprocess.PIPE,
                                       stderr=subprocess.STDOUT if build else subprocess.DEVNULL,
                                       start_new_session=True)
              error = None
              deadline = time.monotonic() + timeout
              try:
                  with selectors.DefaultSelector() as selector:
                      selector.register(child.stdout, selectors.EVENT_READ)
                      while True:
                          remaining = deadline - time.monotonic()
                          if remaining <= 0:
                              error = "TimeoutExpired"
                              break
                          if not selector.select(remaining):
                              error = "TimeoutExpired"
                              break
                          chunk = os.read(child.stdout.fileno(), min(4096, limit + 1 - len(data)))
                          if not chunk:
                              child.wait(timeout=max(0.001, deadline - time.monotonic()))
                              break
                          overflow = len(data) + len(chunk) > limit
                          data.extend(chunk[:limit - len(data)])
                          if overflow:
                              error = "OutputLimitExceeded"
                              break
              except subprocess.TimeoutExpired:
                  error = "TimeoutExpired"
              finally:
                  if child.poll() is None or error is not None:
                      try:
                          os.killpg(child.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                  child.wait(timeout=2)
                  child.stdout.close()
                  if build:
                      text = bytes(data[:limit]).decode("utf-8", errors="replace")
                      for path in (str(output), os.getcwd(), os.environ["RUNNER_TEMP"], "/Users/runner"):
                          text = text.replace(path, "<WORKSPACE>")
                      diagnostic_path.write_bytes(text.encode()[:limit])
              receipt["returncode"] = child.returncode
              if error:
                  receipt["error_class"] = error
                  raise ValueError("bounded_subprocess_failed")
              if check and child.returncode:
                  receipt["error_class"] = "CalledProcessError"
                  raise ValueError("subprocess_failed")
              return bytes(data)

          def checked_harness(raw):
              def unique(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError("duplicate_key")
                      result[key] = value
                  return result
              packet = json.loads(raw, object_pairs_hook=unique,
                                  parse_constant=lambda value: (_ for _ in ()).throw(ValueError("nonfinite")))
              if (not isinstance(packet, dict)
                      or set(packet) != {"schema", "qualification", "images", "rows"}
                      or type(packet["schema"]) is not int or packet["schema"] != 4
                      or packet["qualification"] != "NO_AUDIO_ONLY"
                      or packet["images"] != receipt["image_hashes"]
                      or not isinstance(packet["rows"], list) or not 1 <= len(packet["rows"]) <= 16):
                  raise ValueError("harness_shape")
              modes = set()
              for row in packet["rows"]:
                  if (not isinstance(row, dict)
                          or set(row) != {"mode", "exit", "elapsed_seconds", "receipt"}
                          or row["mode"] not in {"deadline", "guardian_a", "guardian_b", "helper", "suspend"}
                          or row["mode"] in modes or type(row["exit"]) is not int or not -255 <= row["exit"] <= 255
                          or type(row["elapsed_seconds"]) not in {int, float}
                          or not 0 <= row["elapsed_seconds"] <= 45):
                      raise ValueError("harness_row")
                  modes.add(row["mode"])
                  inner = row["receipt"]
                  if (not isinstance(inner, dict)
                          or set(inner) != {"schema", "noaudio_exit", "terminal", "pids", "wait_status"}
                          or type(inner["schema"]) is not int or inner["schema"] != 5
                          or type(inner["noaudio_exit"]) is not int or not 0 <= inner["noaudio_exit"] <= 255
                          or inner["terminal"] != "HOLD"):
                      raise ValueError("harness_authority")
                  for key in ("pids", "wait_status"):
                      if (not isinstance(inner[key], list) or len(inner[key]) != 3
                              or any(type(v) is not int or not 0 <= v <= 2147483647 for v in inner[key])):
                          raise ValueError("harness_cleanup")
              if modes != {"deadline", "guardian_a", "guardian_b", "helper", "suspend"}:
                  raise ValueError("harness_incomplete")
              return packet
          try:
              for path in sorted(Path("native/caption_helper").glob("*")):
                  if path.is_file() and path.suffix in {".c", ".h", ".py", ".plist"}:
                      receipt["source_hashes"][path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
              build = Path("scripts/build_caption_helper.sh")
              receipt["source_hashes"][build.name] = hashlib.sha256(build.read_bytes()).hexdigest()
              # Script is mode 0644. Building does not launch anything.
              stage = "build"
              bounded(["sh", str(build), str(output)], 60, build=True)
              images = output / "CaptionHelper.app/Contents/MacOS"
              stage = "signature"
              for name in ("GuardianA", "GuardianB", "SyntheticHelper", "NoAudioController"):
                  image = images / name
                  receipt["image_hashes"][name] = hashlib.sha256(image.read_bytes()).hexdigest()
                  signature = subprocess.run(["/usr/bin/codesign", "-d", "--verbose=4", str(image)],
                                             check=True, capture_output=True, text=True, timeout=2)
                  fields = {}
                  for line in signature.stderr.splitlines():
                      key, separator, value = line.partition("=")
                      if separator and key in {"Identifier", "CDHash", "TeamIdentifier"}:
                          if key == "TeamIdentifier" and value == "not set":
                              value = "AD_HOC_NO_TEAM"
                          if not re.fullmatch(r"[A-Za-z0-9.()_-]{1,160}", value):
                              raise RuntimeError("invalid_signing_identity")
                          fields[key] = value
                  if not {"Identifier", "CDHash"} <= fields.keys():
                      raise RuntimeError("missing_signing_identity")
                  receipt["signing_identities"][name] = fields
              # The fixed qualifier exclusively invokes --noaudio; capture is compiled out.
              # No raw tool/protocol stdout/stderr enters logs or artifacts, even on failure.
              stage = "qualifier"
              raw = bounded([sys.executable, "native/caption_helper/qualify_assembly.py", str(images)], 45, check=False)
              stage = "qualifier_schema"
              receipt["harness"] = checked_harness(raw)
              if receipt["returncode"] or any(row["exit"] or row["receipt"]["noaudio_exit"]
                                               for row in receipt["harness"]["rows"]):
                  stage = "qualifier"
                  receipt["error_class"] = "QualificationFailed"
                  raise ValueError("qualification_failed")
              receipt["probe_outcome"] = "PASS"
          except Exception as error:
              receipt["probe_outcome"] = "FAIL"
              receipt["error_stage"] = stage
              receipt.setdefault("error_class", type(error).__name__)
              if isinstance(error, subprocess.CalledProcessError):
                  receipt["returncode"] = error.returncode
              raise SystemExit(1) from None
          finally:
              receipt["elapsed_seconds"] = round(time.monotonic() - started, 3)
              receipt_path.write_text(json.dumps(receipt, sort_keys=True) + chr(10))
          PYTHON
      - name: Retain content-free noaudio helper qualification
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helper-noaudio-qualification-macos
          path: |
            ${{ runner.temp }}/caption-helper-noaudio-receipt.json
            ${{ runner.temp }}/caption-helper-build-diagnostics.txt
          retention-days: 7
          if-no-files-found: warn

  dependency-audit:
    name: Locked dependency audit (9 marker resolutions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: false
      - name: Audit Python 3.11–3.13 on Linux, macOS and Windows markers
        shell: bash
        run: |
          git rev-parse HEAD
          uv --version
          sha256sum uv.lock
          make dependency-audit 2>&1 | tee "$RUNNER_TEMP/dependency-audit.txt"
      - name: Retain the dependency audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: locked-dependency-audit-nine-resolutions
          path: ${{ runner.temp }}/dependency-audit.txt
          retention-days: 7
          if-no-files-found: warn
