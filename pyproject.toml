[project]
name = "caption-bridge"
version = "0.4.0"
description = "Mac-local live transcription, translation, and caption readback"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "mistralai>=2,<3",
    "orjson>=3.10,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1,<2",
    "sounddevice>=0.5,<1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "playwright>=1.61,<2",
    "pytest>=8.3,<10",
    "pytest-playwright>=0.7.3,<1",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false
required-version = ">=0.12,<0.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["browser: deterministic browser-level end-to-end contract"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
